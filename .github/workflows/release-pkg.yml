name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish npm packages
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: pnpm build:native

      - name: Verify native addon
        run: |
          addon=packages/vision-native/npm/darwin-arm64/apple-vision.node
          test -s "$addon"
          codesign --verify "$addon"
          node -e "require('./$addon')"

      - run: pnpm --filter @xsai-apple-vision/vision-native test:native

      - run: pnpm build

      - run: pnpm test

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Verify npm packages
        run: pnpm -r publish --access public --no-git-checks --dry-run

      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          pnpm -r publish --access public --no-git-checks
