catalogMode: strict

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1

shellEmulator: true

packages:
  - packages/*
  - packages/vision-native/npm/*
  - examples/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

catalog:
  '@antfu/eslint-config': ^9.3.0
  '@electron-toolkit/preload': ^3.0.2
  '@moeru/eventa': ^1.0.0
  '@types/node': ^25.0.0
  '@valibot/to-json-schema': ^1.5.0
  '@vitejs/plugin-vue': ^6.0.2
  '@xsai/generate-object': 0.5.0
  '@xsai/shared': 0.5.0-beta.8
  '@xsai/stream-text': 0.5.0
  bumpp: ^12.2.0
  electron: ^43.4.1
  electron-builder: ^26.0.12
  electron-vite: ^5.0.0
  error-stack-parser: ^2.1.4
  eslint: ^10.5.0
  eslint-plugin-format: ^2.0.1
  injeca: ^0.2.0
  nanoid: ^6.0.1
  tsdown: ^0.22.2
  typescript: ^6.0.0
  valibot: ^1.5.0
  vite: ^7.3.6
  vitest: ^4.1.0
  vue: ^3.5.41
  vue-tsc: ^3.2.5
